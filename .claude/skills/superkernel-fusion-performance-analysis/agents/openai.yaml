interface:
  display_name: "SuperKernel Fusion Performance Analysis"
  short_description: "Compare each fused SK with its original child interval"
  default_prompt: "Use $superkernel-fusion-performance-analysis as a fresh read-only analysis agent. For ordinary SK-off versus SK-on analysis, validate artifacts and fingerprints, map every SK to baseline child occurrences, classify with interval-first P50/P90/MAD evidence, and return schema 1.2 profiling-analysis-result.json plus Chinese PROFILING_ANALYSIS.md. For a Stage O DCCI-disable regression, instead compare fresh no-option and dcci_disable_on_kernel=[\".*\"] SK-on collections. Require kernel_details.csv, profile-owned SK metadata, and complete sk_prof on both sides; structurally match and report every SK, attribute every significantly slower SK to child wall/execution changes, and return the stable union of all significantly slower child regexes for one combined before+after repair. Never propose standalone before/after Stage O trials. Duration sum is diagnostic only. Do not run inference, edit scopes/options, or claim promotion."
