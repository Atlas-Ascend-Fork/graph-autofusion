<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="944" viewBox="0 0 1280 944" role="img" aria-labelledby="title desc">
  <title id="title">Autofuse MLIR 迁移目标架构</title>
  <desc id="desc">GE、Inductor 和其他框架统一接入 AFIR 方言。AFIR 支持 Tensor-form 和 Buffer-form。基于 AFIR 的 Schedule 待迁移，Codegen 迁移中。Codegen 经后端适配对接 AscendC API 和预留的其他 API，并独立接入 ATT 进行评估、性能建模和 Tiling 生成。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#8190a5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; fill: #20324b; }
      .layer { font-size: 18px; fill: #69788e; }
      .module { font-size: 26px; font-weight: 600; }
      .label { font-size: 21px; }
      .detail { font-size: 18px; fill: #62728a; }
      .status { font-size: 16px; fill: #996214; }
      .edge { fill: none; stroke: #8190a5; stroke-width: 1.7; marker-end: url(#arrow); }
      .join { fill: none; stroke: #8190a5; stroke-width: 1.7; }
    </style>
  </defs>
  <rect width="1280" height="944" fill="#ffffff"/>
  <text x="190" y="48" font-size="30" font-weight="600">Autofuse MLIR 迁移目标架构</text>

  <g text-anchor="end" class="layer">
    <text x="153" y="133">框架接入</text>
    <text x="153" y="267">统一 IR</text>
    <text x="153" y="408">调度优化</text>
    <text x="153" y="573">代码生成</text>
    <text x="153" y="805">后端与建模</text>
  </g>

  <g fill="#f6f8fb" stroke="#d7dee8" stroke-width="1.4">
    <rect x="190" y="94" width="306" height="64" rx="8"/>
    <rect x="538" y="94" width="306" height="64" rx="8"/>
    <rect x="886" y="94" width="306" height="64" rx="8"/>
  </g>
  <g class="module" text-anchor="middle">
    <text x="343" y="135">GE</text>
    <text x="691" y="135">Inductor</text>
    <text x="1039" y="135" font-size="23">其他框架</text>
  </g>
  <path class="edge" d="M343 158 V202"/>
  <path class="edge" d="M691 158 V202"/>
  <path class="edge" d="M1039 158 V202"/>

  <rect x="190" y="202" width="1002" height="114" rx="9" fill="#eff2fd" stroke="#a8b4df" stroke-width="1.5"/>
  <text x="223" y="253" font-size="30" font-weight="600" style="fill:#354e91">AFIR 方言</text>
  <text x="224" y="282" class="detail">承接框架接入 · 双形态</text>
  <path d="M493 228 V290" stroke="#ced5ed" stroke-width="1.4"/>
  <g fill="#ffffff" stroke="#d0d8ef" stroke-width="1.2">
    <rect x="525" y="229" width="300" height="60" rx="7"/>
    <rect x="851" y="229" width="309" height="60" rx="7"/>
  </g>
  <g font-size="23" text-anchor="middle" font-weight="500">
    <text x="675" y="267">Tensor-form</text>
    <text x="1005.5" y="267">Buffer-form</text>
  </g>
  <path class="edge" d="M691 316 V358"/>

  <rect x="190" y="358" width="1002" height="86" rx="9" fill="#f7f9fc" stroke="#c7d1df" stroke-width="1.4"/>
  <text x="223" y="410" class="module">Schedule</text>
  <rect x="368" y="386" width="84" height="28" rx="14" fill="#fff0d6"/>
  <text x="410" y="406" text-anchor="middle" class="status">待迁移</text>
  <text x="1159" y="408" text-anchor="end" class="label">基于 AFIR 的调度优化</text>
  <path class="edge" d="M691 444 V488"/>

  <rect x="190" y="488" width="1002" height="158" rx="9" fill="#f0f5fb" stroke="#9fb5d0" stroke-width="1.5"/>
  <text x="223" y="534" class="module">Codegen</text>
  <rect x="365" y="510" width="84" height="28" rx="14" fill="#fff0d6"/>
  <text x="407" y="530" text-anchor="middle" class="status">迁移中</text>
  <text x="1159" y="532" text-anchor="end" class="detail">面向 AFIR · 隔离底层 API 细节</text>
  <path d="M222 551 H1160" stroke="#d0dce9" stroke-width="1.2"/>
  <g text-anchor="middle" class="label">
    <text x="374" y="601">循环与内存生成</text>
    <text x="691" y="601">实现选择与 Lowering</text>
    <text x="1008" y="601">内核与入口生成</text>
  </g>
  <path d="M533 576 V611 M850 576 V611" stroke="#cfdae8" stroke-width="1.2"/>

  <path class="edge" d="M512 646 V704"/>
  <path class="edge" d="M1039 646 V704"/>

  <rect x="190" y="704" width="644" height="64" rx="8" fill="#f7f9fc" stroke="#c7d1df" stroke-width="1.4"/>
  <text x="213" y="744" font-size="22" font-weight="500">后端适配</text>
  <path d="M323 721 V751" stroke="#d3dbe6" stroke-width="1.2"/>
  <text x="348" y="743" font-size="19">能力查询 · 实现注册 · API 映射与发射</text>

  <path class="join" d="M512 768 V789 M343 789 H681"/>
  <path class="edge" d="M343 789 V812"/>
  <path class="edge" d="M681 789 V812"/>
  <rect x="190" y="812" width="306" height="80" rx="8" fill="#f6f8fb" stroke="#c7d1df" stroke-width="1.4"/>
  <rect x="528" y="812" width="306" height="80" rx="8" fill="#ffffff" stroke="#b9c4d3" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="343" y="861" text-anchor="middle" class="module">AscendC API</text>
  <text x="681" y="847" text-anchor="middle" font-size="24" font-weight="500">其他 API</text>
  <text x="681" y="875" text-anchor="middle" class="detail">扩展预留</text>

  <rect x="886" y="704" width="306" height="188" rx="9" fill="#f0f8f7" stroke="#a4c6c1" stroke-width="1.5"/>
  <text x="1039" y="752" text-anchor="middle" class="module" style="fill:#285e5c">ATT</text>
  <text x="1039" y="788" text-anchor="middle" class="label">评估 · 性能建模</text>
  <path d="M915 811 H1163" stroke="#c6ded9" stroke-width="1.2"/>
  <text x="1039" y="851" text-anchor="middle" class="detail">候选选优 · Tiling 生成</text>
</svg>
