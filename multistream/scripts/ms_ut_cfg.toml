[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/tests/*", "*/build/*", "*/dist/*", "*/venv/*"]
data_file = "coverage/ut/.coverage"

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.coverage.html]
directory = "coverage/ut/html"

[tool.coverage.xml]
output = "coverage/ut/coverage.xml"
